## JVM Properties
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
## maven.neoforged.net resets connections intermittently; retry rather than fail.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=500

## ---- Local HTTP proxy -----------------------------------------------------
## The JVM does not read the Windows system proxy, so without these the Gradle daemon
## goes direct while every other program on this machine goes through sing-box - and the
## direct route to maven.neoforged.net is what resets. That is not a slow-network
## symptom: it fails the dependency check outright, and it is what stopped the IDE
## import with
##
##     Could not resolve org.parchmentmc.data:parchment-1.21.11:2025.12.21-nightly-SNAPSHOT
##     Connect to 127.0.0.1:7897 [/127.0.0.1] failed: Connection refused: getsockopt
##
## The port is the local VPN client's (D:\SingLinkVPN\singcore.exe; Windows system proxy
## is HKCU\...\Internet Settings -> ProxyEnable=1, ProxyServer=127.0.0.1:7897). If the
## client is not running, or is on a different port, edit these two lines - an unusable
## proxy is worse than none, because every request then fails at the socket instead of
## falling back to a direct connection. Blank the host to force a direct connection.
##
## An older JEI version is pinned in this file for the same reason: an unnamed or
## re-resolving repository hits the network on every sync even when the artifact is
## already in the cache, and that fails the moment the VPN is down.
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=7897
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=7897
systemProp.http.nonProxyHosts=localhost|127.*|[::1]|10.*|192.168.*|172.16.*|172.17.*|172.18.*|172.19.*|172.2*|172.30.*|172.31.*
## The CDN drops reused connections; a fresh one per request is slower but completes.
systemProp.http.keepAlive=false

## Environment Properties
minecraft_version=26.1.2
minecraft_version_range=[26.1.2,27.1)
neo_version=26.1.2.112
neo_version_range=[26,)
loader_version_range=[4,)
parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.21-nightly-SNAPSHOT

## Mod Properties
