## JEI and TerraBlender publish one version number for several loaders at once. Do not drop the
## "-neoforge": without it Modrinth's maven hands back whichever file it picks, and the build then
## dies with ~48 errors about net.minecraft.class_1703.
## Pinned to the version Thaumaturge compiles against, not to the newest. Between 19.36 and 19.57 JEI
## added an IIngredientFilterConfig parameter to mezz.jei.gui.ingredients.ListElementInfo.createFromElement,
## and Thaumaturge's compat/jei/JeiSearchIndex.java calls the three argument form, so a newer JEI dies
## with NoSuchMethodError the moment JEI's search box is used.
jei_version=19.36.0.360-neoforge
terrablender_version=4.1.0.8-neoforge
lithostitched_version=1.8.0-neoforge-21.1
apollib_version=1.2.0-neoforge-21.1

## Not resolved from maven: All Rights Reserved with no artifact, so whoever builds this compiles it
## from source. The commit this addon's 223 Thaumaturge imports were written against; see
## tools/fetch-thaumaturge.*, and bumping it means confirming the imports still compile.
## This is the head of upstream's 1.21.1 branch. The previous pin, 9acb9143, was a rebased copy of
## 9be01c76 sitting on a feature branch; it is not an ancestor of 1.21.1 any more.
thaumaturge_commit=8eb4908866d584e3e3da8c3adcacd141d8a953cf
