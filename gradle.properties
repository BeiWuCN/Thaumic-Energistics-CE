## JVM Properties
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
## maven.neoforged.net resets connections intermittently; retry rather than fail.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=500

## Environment Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.250
neo_version_range=[21.1.250,)
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Mod Properties
## The mod id intentionally matches upstream Thaumic Energistics so the reused assets resolve.
mod_id=thaumicenergistics_ce
mod_name=Thaumic Energistics: CE
mod_license=MIT
mod_version=2.6.1.2
mod_group_id=thaumicenergistics
mod_authors=BeiWuCN, Nividica, Alkusure86, Community
mod_description=Bridges Thaumaturge essentia with Applied Energistics 2 ME networks. Community Edition (1.21.1 / NeoForge).

## Dependencies
## Every mod below is a real maven coordinate from the Modrinth maven repository, pinned to the exact
## version this addon was built and tested against, so a fresh clone resolves them and builds with
## nothing staged by hand. Modrinth's own version strings carry a "+"; it is part of the name.
ae2_version=19.2.17
guideme_version=21.1.17
jade_version=15.10.6+neoforge
curios_version=9.5.1+1.21.1
## JEI and TerraBlender publish one version number for several loaders at once. Do not drop the
## "-neoforge": without it Modrinth's maven hands back whichever file it picks, which for 19.57.0.444
## is the Fabric jar, and the build then dies with ~48 errors about net.minecraft.class_1703 and
## friends - Fabric intermediary names nothing here has ever seen.
jei_version=19.57.0.444-neoforge
terrablender_version=4.1.0.8-neoforge
## Thaumaturge requires both of these at runtime. This mod imports neither. Their version numbers
## already name the loader, so they take no filter.
lithostitched_version=1.8.0-neoforge-21.1
apollib_version=1.2.0-neoforge-21.1

## Thaumaturge is the one dependency that is not resolved from maven: it is All Rights Reserved and
## publishes no artifact, so it is compiled from source by whoever builds this. This is the commit
## this addon's 223 Thaumaturge imports were written against, and what tools/fetch-thaumaturge.*
## checks out. Bumping it means rebuilding it and confirming the imports still compile.
thaumaturge_commit=9acb9143a9fb86f1a6cba55f1284ecbd45825fba
