org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Local JDKs: 21 is the toolchain, 25 is available for Gradle itself.
org.gradle.java.installations.paths=C:/Java/jdk-21,C:/Java/jdk-25
org.gradle.java.installations.auto-download=false

## maven.neoforged.net resets connections intermittently; retry rather than fail.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=500

minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.265
neo_version_range=[21.1.265,21.2.0)
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## The mod id intentionally matches upstream Thaumic Energistics so the reused assets resolve.
mod_id=thaumicenergistics_ce
mod_name=Thaumic Energistics CE
mod_license=Code: MIT; Textures: CC BY-NC-SA 3.0 (see LICENSE-ASSETS.md)
mod_version=2.7.5.5
mod_group_id=thaumicenergistics
mod_authors=BeiWuCN
mod_description=Bridges Thaumaturge essentia with Applied Energistics 2 ME networks. Community Edition (1.21.1 / NeoForge).

ae2_version=19.2.17
guideme_version=21.1.17
jade_version=15.10.6+neoforge
curios_version=9.5.1+1.21.1
## JEI and TerraBlender publish one version number for several loaders at once. Do not drop the
## "-neoforge": without it Modrinth's maven hands back whichever file it picks, and the build then
## dies with ~48 errors about net.minecraft.class_1703.
## JEI 19.70 for dev parity with TAT and the thaumaturge_tinkerer gate [19.64,20).
## All 14 mezz.jei API classes TECE uses still exist in 19.70; 6-arg transferRecipe remains.
## Prior baseline was 19.57.0.451-neoforge; ExtendedAE Plus is not loaded in this dev suite.
jei_version=19.70.0.469-neoforge
terrablender_version=4.1.0.8-neoforge
lithostitched_version=1.8.0-neoforge-21.1
apollib_version=1.2.0-neoforge-21.1

## Supported public Thaumaturge release. Override with -Pthaumaturge_jar when needed.
# Official release: CurseForge file 9452543 (Thaumaturge 1.1.0 / Minecraft 1.21.1).
