## Dependencies
## Every mod below is a real maven coordinate from the Modrinth maven repository, pinned to the exact
## version this addon was built and tested against, so a fresh clone resolves them and builds with
## nothing staged by hand. Modrinth's own version strings carry a "+"; it is part of the name.
ae2_version=26.1.13-beta
guideme_version=26.1.15-beta
jade_version=26.1.8+neoforge
curios_version=15.0.0+26.1.2
## JEI is not taken from the Modrinth maven repository, because its version numbers there carry no
## loader suffix and the bare number hands back the FABRIC jar. That jar still compiles against - the
## mezz.jei.api packages are loader-independent - so the mistake is invisible until a dev run, where
## NeoForge does not load it at all:
##
##     Mod List: (no jei)                       <- 26.1.2 run, 2026-10-08
##     jei-29.43.0.107.jar: 1241 entries, fabric.mod.json, NO META-INF/neoforge.mods.toml
##
## JEI publishes a proper NeoForge artifact under its own group, and that is the one pinned here. It
## lives in mavenCentral(), which build.gradle already declares. When bumping it, check the candidate
## actually carries META-INF/neoforge.mods.toml - the two artifacts are the same size to within 30%
## and the version number alone says nothing about the loader.
jei_version=29.6.2.31
## TerraBlender is gone on purpose, and adding it back aborts startup. The 1.21.1 line needed it for
## Thaumcraft's biomes. Thaumaturge 1.0.2 - the current 26.1.2 line - requires only lithostitched and
## curios, and not one source file or resource in this tree names TerraBlender. Worse, its newest
## artifact, 26.1.2.0.3, declares "neoforge [26.2,)" in its own META-INF/neoforge.mods.toml, while
## this line is 26.1.2.112, so having it on the run classpath is enough to fail the load:
##
##     Mod terrablender requires neoforge 26.2 or above
##     Currently, neoforge is 26.1.2.112
##
## The version string is misleading: it names the Minecraft line, not the loader it was built against.
## Reinstate it only when something in the tree actually imports it, and check that range first.
## Thaumaturge requires both of these at runtime. This mod imports neither. Their version numbers
## already name the loader, so they take no filter.
lithostitched_version=1.8.0-neoforge-26.1
apollib_version=1.2.0-neoforge-26.1

## Thaumaturge is the one dependency that is not resolved from maven: it is All Rights Reserved and
## publishes no artifact, so it is compiled from source by whoever builds this. Upstream's 26.1.2 line
## is at github.com/Leclowndu93150/Thaumaturge (mod_version 1.0.2), and that is what the jar in libs/
## was built from. There is no 0.2.1 jar left in the tree: 1.0.2 is a rewrite, not a bump, and the
## source here was migrated onto it.
##
## Two scripts build it, and they pin different things:
##
##     tools/build-thaumaturge.ps1   the 26.1.2 jar this project uses, at the commit below
##     tools/fetch-thaumaturge.*     the 1.21.1 line, at a commit of its own (unrelated to this one)
##
## Bumping this commit means rebuilding the jar with build-thaumaturge.ps1 and confirming the imports
## still compile: 0.2.1 to 1.0.2 deleted the whole focus API (api/casters) and the registry package,
## replacing them with the spell system (api/spell), so a version bump is a source migration.
thaumaturge_commit=de63133232483fce39a8e9fc1499f8f4e7e82379
