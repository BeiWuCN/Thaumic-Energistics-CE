## JVM Properties
org.gradle.jvmargs=-Xmx4G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
## maven.neoforged.net resets connections intermittently on this network; retry rather than fail.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=500

## Environment Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.250
neo_version_range=[21.1.250,)
loader_version_range=[4,)
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

## Mod Properties
## The mod id intentionally matches upstream Thaumic Energistics so the reused assets resolve.
mod_id=thaumicenergistics_ce
mod_name=Thaumic Energistics: CE
mod_license=MIT
mod_version=1.4.179.2287
mod_group_id=thaumicenergistics
mod_authors=Nividica, Community
mod_description=Bridges Thaumaturge essentia with Applied Energistics 2 ME networks. Community Edition (1.21.1 / NeoForge).

## Dependencies
## Mods that must be present at compile time. Thaumaturge has no published maven artifact,
## so it is resolved from libs/ as a flat file (see libs/README.md).
ae2_version=19.2.17

## Runtime-only mods (dev environment). These are optional for compiling.
curios_version=9.5.1
jei_version=19.36.0.360
# CurseForge file id for terrablender-neoforge 4.1.0.0 (1.21.1), a hard Thaumaturge dependency.
terrablender_file_id=6054947
