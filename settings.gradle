pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }

    // If maven.neoforged.net is unreachable from your network (it resets connections intermittently
    // in some environments), uncomment the line below and populate ../local-maven with the NeoForge
    // artifacts for your `neo_version`. This repository does not ship such a mirror.
    // maven { url = '../local-maven' }
}

// The 26.1.2 line pins Java 25. foojay lets Gradle provision that toolchain itself when the machine
// does not already have one, rather than failing the build on a missing toolchain. Upstream Thaumaturge
// declares the same resolver at the same version.
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'ThaumicEnergistics'
