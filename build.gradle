plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id
base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    // The mod dependencies are ordinary maven coordinates, pinned to exact versions in
    // gradle.properties. Scoped by group so this repository can never answer for anything else.
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // NeoForge itself arrives through the moddev plugin, which adds maven.neoforged.net over in
    // settings.gradle. These two cover the build plugins and the optional local mirror.
    mavenLocal()
    mavenCentral()
    // maven { url = '../local-maven' }
}

neoForge {
    version = project.neo_version

    // Makes Slot's position fields writable, so a screen of ours can place an AE2 fake slot - which has
    // no coordinate parameter of its own. See src/main/resources/META-INF/accesstransformer.cfg.
    accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Declare OUR source set and nothing else. Thaumaturge needs no entry here: it reaches the run
    // as an ordinary dependency, and ModDevGradle derives the run config from the jar it finds.
    //
    // This block used to also map "thaumaturge" onto sourceSets.main, which is wrong: a mod entry
    // contributes its source set's class folders to the run, so that entry handed the loader this
    // project's own output under Thaumaturge's name - the mod was reported loaded twice, once as
    // ours and once as Thaumaturge's.
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        client {
            client()
            // There is no switch to run without this mod, and there cannot be one here. Both the
            // environment variable (MOD_CLASSES) and RunModel.loadedMods were tried: the first leaves
            // the mod's class output on the run classpath, where its neoforge.mods.toml is discovered
            // regardless of the coordinates; the second does remove the mod, but then its datapack
            // still loads through the pack finder while none of its items, blocks or aspect keys are
            // ever registered. Every research entry naming one of them then fails to resolve:
            //
            //     Failed to parse .../research_entry/arcane_assembler.json from pack mod/thaumicenergistics
            //     Caused by: Failed to get element thaumicenergistics_ce:essentia_terminal
            //
            // and the world refuses to load. A run that produces a broken world is worse than no switch.
            // To see the mod absent, build a jar and drop it into a separate profile with no
            // Thaumaturge - but note that Thaumaturge is a hard dependency, so the loader refuses
            // before any of this is even reached.
            //
            // Quick-play into the existing dev world when asked. `MenuSelfTest` needs a player to exist -
            // every menu takes an Inventory, and an Inventory needs one - so it skips on a dedicated server
            // nobody has joined, which is the only way it can otherwise be run here. With this it runs on
            // world load:
            //
            //     ./gradlew runClient -PquickPlay="New World"
            //
            // Left out by default so the plain run still stops at the title screen.
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay')
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG

            // The self-tests and the trace switches are turned on by environment variables, and a forked
            // run does not inherit the shell's. Passing them through is what makes the documented
            //
            //     THAUMICENERGISTICS_INSCRIBER_SELFTEST=true ./gradlew runClient -PquickPlay="New World"
            //
            // actually run anything: without this the variable is set in the shell, silently dropped by
            // the fork, and every test reports nothing at all - which looks exactly like a pass.
            //
            // By prefix, not by a list. The list this replaces had to be extended for every new switch,
            // and did not always get extended: the encoder self-test and the whole vis-relay switch were
            // in the code and absent from it, so both reported nothing and that read as a pass.
            System.getenv().each { name, value ->
                if (name.startsWith('THAUMICENERGISTICS_')) {
                    environment name, value
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// ---- Thaumaturge: built by the builder, never shipped ---------------------
// It is All Rights Reserved. Its LICENSE forbids publishing the mod or any binary built from it and
// names "GitHub Releases on a fork" as forbidden, so this repository cannot carry the jar, and it
// publishes no maven artifact either, so it cannot be resolved. Section 2.4 does allow building it
// for your own use, which is what tools/fetch-thaumaturge.* does: once, from the canonical
// repository, at the commit pinned in gradle.properties. See libs/README.md.
def thaumaturgeJars = fileTree(dir: 'libs', include: ['thaumaturge-*.jar'])
if (thaumaturgeJars.isEmpty()) {
    throw new GradleException("""
        No Thaumaturge jar in libs/.

        Thaumaturge is All Rights Reserved and publishes no maven artifact, so it cannot be
        downloaded for you - every builder compiles it from the canonical repository themselves.
        Run one of these once and it will be there:

            tools/fetch-thaumaturge.sh                      (Linux, macOS, CI)
            powershell -File tools/fetch-thaumaturge.ps1    (Windows PowerShell)

        It clones github.com/Leclowndu93150/Thaumaturge at ${thaumaturge_commit} and leaves the
        built jar in libs/. Do not commit it or pass it on; the licence forbids both.
    """.stripIndent())
}

dependencies {
    compileOnly "org.jspecify:jspecify:1.0.0"

    // ---- Mod dependencies -------------------------------------------------
    // Pinned in gradle.properties, resolved from the Modrinth maven repository. `implementation`
    // rather than a split of compile and runtime on purpose: Thaumaturge's and AE2's public
    // signatures name GuideME, Curios and Jade types, so every one of these has to be on the compile
    // classpath for this mod to compile at all, and on the runtime classpath for the dev run.
    implementation "maven.modrinth:ae2:${ae2_version}"
    implementation "maven.modrinth:guideme:${guideme_version}"
    implementation "maven.modrinth:jei:${jei_version}"
    implementation "maven.modrinth:jade:${jade_version}"
    implementation "maven.modrinth:curios:${curios_version}"
    implementation "maven.modrinth:terrablender:${terrablender_version}"
    implementation "maven.modrinth:lithostitched:${lithostitched_version}"
    implementation "maven.modrinth:apollib:${apollib_version}"

    // Thaumaturge, from the local build the guard above insists on.
    implementation thaumaturgeJars
}

tasks.named('compileJava') {
    options.compilerArgs << '-Xmaxerrs' << '2000'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// The default test task is off: the checks that matter here need a running game, and are a diagnostic
// inside the mod rather than a unit test - see ThaumicEnergistics.recipeSelfTest.
tasks.named('test') {
    enabled = false
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_id
            from components.java
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
