plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id
base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    // Repositories for dev-only runtime mods declared by coordinates below.
    // maven.modrinth.com is unreachable on this machine; api.modrinth.com/maven serves the same group.
    maven { url = 'https://maven.blamejared.com'; content { includeGroup 'mezz.jei'; includeGroup 'net.mezzdev.config' } }
    maven { url = 'https://maven.latvian.dev/releases'; content { includeGroupByRegex 'dev\\.latvian\\..*' } }
    maven { url = 'https://jitpack.io'; content { includeGroup 'com.github.rtyley' } }
    maven { url = 'https://maven.shedaniel.me'; content { includeGroup 'me.shedaniel.cloth' } }
    mavenLocal()
    mavenCentral()
    // maven { url = '../local-maven' }
}

// Dev runtime mods live in their own configuration so they never leak into the published jar.
// MDG's runClient uses clientRuntimeClasspath, which does NOT inherit localRuntime by default:
// without the line below the modules resolve but the dev client boots without any of them.
configurations {
    runtimeClasspath.extendsFrom localRuntime
    clientRuntimeClasspath.extendsFrom localRuntime
}

neoForge {
    version = project.neo_version

    // Slot's position fields are not writable without this, which would leave AE2's fake slot with no
    // way to be placed. See src/main/resources/META-INF/accesstransformer.cfg.
    accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            if (project.hasProperty('portRuntimeRegression')) sourceSet(sourceSets.test)
        }
    }

    runs {
        if (project.hasProperty('portRuntimeRegression')) {
            portRuntimeRegression {
                type = 'gameTestServer'
                gameDirectory.set(layout.projectDirectory.dir('run/port-runtime-regression'))
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }
        }
        client {
            client()
            if (project.hasProperty('clientGameDirectory')) {
                gameDirectory.set(layout.projectDirectory.dir(project.property('clientGameDirectory')))
            }
            // A run without this mod cannot be produced: its classes stay on the run classpath, and with
            // the mod gone its datapack still loads, so research entries naming its items fail:
            //
            //     Failed to parse .../research_entry/arcane_assembler.json from pack mod/thaumicenergistics
            //     Caused by: Failed to get element thaumicenergistics_ce:essentia_terminal
            //
            // Quick-play into the existing dev world on request; off by default:
            //     ./gradlew runClient -PquickPlay="New World"
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay')
            }
        }
        server {
            server()
            programArgument '--nogui'

            // A client and a dedicated server cannot share a directory: whichever starts second dies on
            // the world lock, and the server recycles latest.log on every start, destroying the previous
            // run's evidence. The client stays in run/; server output is run/server/logs/latest.log.
            gameDirectory.set(layout.projectDirectory.dir('run/server'))
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            if (project.hasProperty('clientPortSmoke')) systemProperty 'tece.portClientSmoke', 'true'
            if (project.hasProperty('clientWorldSmoke')) systemProperty 'tece.portWorldSmoke', 'true'
            logLevel = org.slf4j.event.Level.DEBUG

            // A forked run does not inherit the shell's environment, so the THAUMICENERGISTICS_* trace
            // switches are passed through by prefix: a new switch in the code needs no change here.
            System.getenv().each { name, value ->
                if (name.startsWith('THAUMICENERGISTICS_')) {
                    environment name, value
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Curios requires this resource path; generate it without adding repository directories.
def curioItems = ["${mod_id}:wireless_essentia_terminal", "${mod_id}:wireless_arcane_crafting_terminal"]
def generatePortResources = tasks.register('generatePortResources') {
    def output = layout.buildDirectory.file('generated/portResources/data/curios/tags/item/curio.json')
    inputs.property('curioItems', curioItems)
    outputs.file output
    doLast {
        def target = output.get().asFile
        target.parentFile.mkdirs()
        target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([replace: false, values: curioItems]))
    }
}
// Curios tags are supplied directly by src/main/resources.
tasks.named('processResources') { dependsOn generatePortResources }
tasks.named('sourcesJar') { dependsOn generatePortResources }
tasks.named('sourcesJar') {
    from(projectDir) {
        include 'LICENSE', 'LICENSE-ASSETS.md', 'LICENSE-CC-BY-NC-SA-3.0.txt'
        into 'META-INF/licenses'
    }
}

// Optional local verification sources are deliberately outside the published repository.
def portVerificationDir = providers.gradleProperty('portVerificationDir').orElse(
        providers.provider { file('_scratch/verification').isDirectory() ? '_scratch/verification' : null })
if (project.hasProperty('portRuntimeRegression') && !portVerificationDir.isPresent()) {
    throw new GradleException('Set -PportVerificationDir=/path/to/local/verification/sources for game regressions')
}

// The CF release is the compatibility target. A local JAR can be supplied for diagnostics.
def thaumaturgeDependency = providers.gradleProperty('thaumaturge_jar').isPresent()
        ? files(providers.gradleProperty('thaumaturge_jar').get())
        : "curse.maven:thaumaturge-1628024:9452543"

dependencies {
    compileOnly "org.jspecify:jspecify:1.0.0"

    // Pinned in gradle.properties. Thaumaturge's and AE2's own signatures name GuideME, Curios and Jade
    // types, so all of these are needed to compile at all, not just to run.
    implementation "maven.modrinth:ae2:${ae2_version}"
    implementation "maven.modrinth:guideme:${guideme_version}"
    implementation "maven.modrinth:jei:${jei_version}"
    implementation "maven.modrinth:jade:${jade_version}"
    implementation "maven.modrinth:curios:${curios_version}"
    implementation "maven.modrinth:terrablender:${terrablender_version}"
    implementation "maven.modrinth:lithostitched:${lithostitched_version}"
    implementation "maven.modrinth:apollib:${apollib_version}"

    // Thaumaturge, from the CurseForge release pinned above (file 9452543).
    implementation thaumaturgeDependency
    compileOnly("maven.modrinth:advancedae:1.6.12-1.21.1") { transitive = false }
    if (!project.hasProperty('withoutCompatibilityMods')) {
        runtimeOnly fileTree(dir: 'libs/compat', include: ['*.jar'])
    }

    // AE2's JEI layer was split out of AE2 in 1.21 and lives in its own mod, so nothing in
    // the AE2 jar answers to mezz.jei any more. compileOnly because TECE only talks to it
    // when it is installed; localRuntime puts it in the dev client so the transfer buttons
    // and recipe categories are actually there to test against.
    compileOnly "curse.maven:ae2-jei-integration-1074338:7727898"
    localRuntime "curse.maven:ae2-jei-integration-1074338:7727898"

    // ---------------------------------------------------------------------------
    // Dev-only runtime mods (never shipped). Coordinates, no local jars.
    // Roster mirrors Thaumaturge-Aspect-Tooltip's dev client, minus mods TECE already
    // declares as implementation (AE2 / GuideME / JEI / Jade / Curios / Lithostitched),
    // minus TECE's own release build (would clash with this source tree), and minus
    // the four mods that have no public coordinate (ExtendedAE, ae2jeiintegration,
    // thaumaturge_tinkerer, thaumicbases). See docs/DEV_ENV.md.
    // Curse Maven reachability was verified 2026-11-19: all coordinates return 200.
    localRuntime 'curse.maven:ae2-pattern-disk-1698612:9384288'
    localRuntime 'curse.maven:architectury-api-419699:8492726'
    localRuntime 'curse.maven:ftb-library-404465:9350706'
    localRuntime 'curse.maven:geckolib-388172:8893490'
    localRuntime 'curse.maven:modern-ui-352491:8206075'
    localRuntime 'curse.maven:spark-361579:6225208'

    // Thaumaturge addons. Coordinates verified reachable 2026-11-19 (POM + JAR both 200).
    // TAT loaded these from local jars; both have public Curse Maven coordinates, so use them.
    // bases: TAT's local jar was 3.6.023.5, which is not published; 3.6.024.0 is the closest
    // 1.21.1 NeoForge build. Its mods.toml requires neoforge [21.1.265,), hence the raised
    // neo_version baseline in gradle.properties. Its file id is 9582970.
    localRuntime 'curse.maven:thaumtinkerer-1793843:9611477'   // thaumaturge_tinkerer 0.3
    localRuntime 'curse.maven:thaumic-bases-unofficial-293406:9582970' // bases 3.6.024.0

    localRuntime 'dev.latvian.mods:kubejs-neoforge:2101.7.2-build.381'
    localRuntime 'dev.latvian.mods:rhino:2101.2.7-build.85'

    // Modrinth coordinates use opaque version IDs where a version number would resolve to
    // the wrong loader's artifact. Sodium 0.6.13 is self-contained; 0.8.x is a JarJar
    // wrapper that never unpacks when passed on the classpath.
    localRuntime 'maven.modrinth:ae2-omni-cells:1.1.6-1.21.1-neoforge'
    localRuntime 'maven.modrinth:applied-energistics-2-wireless-terminals:19.5.1'
    localRuntime 'maven.modrinth:cloth-config:15.0.140+neoforge'
    localRuntime 'maven.modrinth:fusion-connected-textures:1.3.16-neoforge-mc1.21.1'
    localRuntime 'maven.modrinth:itemzoomer:2.0.1-1.21.1'
    localRuntime 'maven.modrinth:jade-addons-forge:6.1.2+neoforge'
    localRuntime 'maven.modrinth:justenoughcharacters:iNnJuUnx'
    localRuntime 'maven.modrinth:mezzconfig:V6oWFnxW'
    localRuntime 'maven.modrinth:mezzconfiggui:mc1.21.1-0.5.5'
    localRuntime 'maven.modrinth:mod-menu-neoforge-edition:1.0.2'
    localRuntime 'maven.modrinth:modernfix:5.27.27+mc1.21.1'
    localRuntime 'maven.modrinth:polymorph:VEburL70'
    localRuntime 'maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge'
}

tasks.named('compileJava') {
    options.compilerArgs << '-Xmaxerrs' << '2000'
}

// Every text file in this tree is UTF-8 (no BOM, LF). Without the flag javac falls back to the platform
// charset, which is GBK on a Chinese Windows box, and a non-ASCII comment or literal then either trips
// "unmappable character" or lands in the class file as mojibake. `withType` rather than
// `named('compileJava')` so the IDE sync and any future source set are covered too; Javadoc reads the
// same files. This file itself stays pure ASCII: Gradle reads build scripts with the platform charset.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// The default test task is off: the checks that matter here need a running game.
tasks.named('test') {
    enabled = false
}

if (portVerificationDir.isPresent()) {
    sourceSets.test.java.setSrcDirs([file(portVerificationDir.get())])
    sourceSets.test.java.include('Port*.java', 'AssemblerVisPoolRegression.java')
    tasks.register('portRegression', JavaExec) {
        group = 'verification'
        description = 'Verify 1.21.1 backport VIS bounds and legacy-save conservation.'
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath + sourceSets.main.runtimeClasspath
        mainClass = 'com.beiwu.thaumicenergistics_ce.blockentity.assembler.AssemblerVisPoolRegression'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    }
    
    sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
    sourceSets.test.resources.setSrcDirs([layout.buildDirectory.dir('generated/portTestResources')])
    def generatePortTestRecipe = tasks.register('generatePortTestRecipe', Copy) {
        from(file(portVerificationDir.get() + '/port_payment_regression.json'))
        into layout.buildDirectory.dir('generated/portTestResources/data/thaumicenergistics_ce/recipe')
    }
    def generatePortTestStructure = tasks.register('generatePortTestStructure', JavaExec) {
        dependsOn tasks.named('compileTestJava')
        classpath = sourceSets.test.output.classesDirs + sourceSets.main.runtimeClasspath
        mainClass = 'com.beiwu.thaumicenergistics_ce.PortTestStructure'
        def target = layout.buildDirectory.file('generated/portTestResources/data/thaumicenergistics_ce/structure/empty.nbt')
        args target.get().asFile.absolutePath
        outputs.file target
    }
    tasks.named('processTestResources') { dependsOn generatePortTestStructure, generatePortTestRecipe }
}

jar {
    from(projectDir) {
        include 'LICENSE', 'LICENSE-ASSETS.md', 'LICENSE-CC-BY-NC-SA-3.0.txt'
        into 'META-INF/licenses'
    }
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_id
            from components.java
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
