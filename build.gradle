plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id
base {
    archivesName = "${mod_id}-${minecraft_version}-neoforge"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    mavenLocal()
    mavenCentral()
    // maven { url = '../local-maven' }
}

neoForge {
    version = project.neo_version

    // Slot's position fields are not writable without this, which would leave AE2's fake slot with no
    // way to be placed. See src/main/resources/META-INF/accesstransformer.cfg.
    accessTransformers.from 'src/main/resources/META-INF/accesstransformer.cfg'

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            if (project.hasProperty('portRuntimeRegression')) sourceSet(sourceSets.test)
        }
    }

    runs {
        if (project.hasProperty('portRuntimeRegression')) {
            portRuntimeRegression {
                type = 'gameTestServer'
                gameDirectory.set(layout.projectDirectory.dir('run/port-runtime-regression'))
                systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            }
        }
        client {
            client()
            // A run without this mod cannot be produced: its classes stay on the run classpath, and with
            // the mod gone its datapack still loads, so research entries naming its items fail:
            //
            //     Failed to parse .../research_entry/arcane_assembler.json from pack mod/thaumicenergistics
            //     Caused by: Failed to get element thaumicenergistics_ce:essentia_terminal
            //
            // Quick-play into the existing dev world on request; off by default:
            //     ./gradlew runClient -PquickPlay="New World"
            if (project.hasProperty('quickPlay')) {
                programArguments.addAll '--quickPlaySingleplayer', project.property('quickPlay')
            }
        }
        server {
            server()
            programArgument '--nogui'

            // A client and a dedicated server cannot share a directory: whichever starts second dies on
            // the world lock, and the server recycles latest.log on every start, destroying the previous
            // run's evidence. The client stays in run/; server output is run/server/logs/latest.log.
            gameDirectory.set(layout.projectDirectory.dir('run/server'))
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG

            // A forked run does not inherit the shell's environment, so the THAUMICENERGISTICS_* trace
            // switches are passed through by prefix: a new switch in the code needs no change here.
            System.getenv().each { name, value ->
                if (name.startsWith('THAUMICENERGISTICS_')) {
                    environment name, value
                }
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// Curios requires this resource path; generate it without adding repository directories.
def curioItems = ["${mod_id}:wireless_essentia_terminal", "${mod_id}:wireless_arcane_crafting_terminal"]
def generatePortResources = tasks.register('generatePortResources') {
    def output = layout.buildDirectory.file('generated/portResources/data/curios/tags/item/curio.json')
    inputs.property('curioItems', curioItems)
    outputs.file output
    doLast {
        def target = output.get().asFile
        target.parentFile.mkdirs()
        target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([replace: false, values: curioItems]))
    }
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/portResources'))
tasks.named('processResources') { dependsOn generatePortResources }
tasks.named('sourcesJar') { dependsOn generatePortResources }

// Optional local verification sources are deliberately outside the published repository.
def portVerificationDir = providers.gradleProperty('portVerificationDir')
if (project.hasProperty('portRuntimeRegression') && !portVerificationDir.isPresent()) {
    throw new GradleException('Set -PportVerificationDir=/path/to/local/verification/sources for game regressions')
}

// Compile against the supported public 1.21.1 release, never a 26.1.2 source build.
// This local dependency is excluded from version control and from the release JAR.
def thaumaturgeFile = file(providers.gradleProperty('thaumaturge_jar')
        .getOrElse('libs/thaumaturge-1.21.1-NeoForge-1.0.2.jar'))
if (!thaumaturgeFile.isFile()) {
    throw new GradleException('Place Thaumaturge 1.21.1 NeoForge 1.0.2 in libs/, or set -Pthaumaturge_jar=/path/to/the/release.jar')
}
def thaumaturgeJars = files(thaumaturgeFile)
dependencies {
    compileOnly "org.jspecify:jspecify:1.0.0"

    // Pinned in gradle.properties. Thaumaturge's and AE2's own signatures name GuideME, Curios and Jade
    // types, so all of these are needed to compile at all, not just to run.
    implementation "maven.modrinth:ae2:${ae2_version}"
    implementation "maven.modrinth:guideme:${guideme_version}"
    implementation "maven.modrinth:jei:${jei_version}"
    implementation "maven.modrinth:jade:${jade_version}"
    implementation "maven.modrinth:curios:${curios_version}"
    implementation "maven.modrinth:terrablender:${terrablender_version}"
    implementation "maven.modrinth:lithostitched:${lithostitched_version}"
    implementation "maven.modrinth:apollib:${apollib_version}"

    // Thaumaturge, from the local build the guard above insists on.
    implementation thaumaturgeJars
    compileOnly("maven.modrinth:advancedae:1.6.12-1.21.1") { transitive = false }
    if (!project.hasProperty('withoutCompatibilityMods')) {
        runtimeOnly fileTree(dir: 'libs/compat', include: ['*.jar'])
    }
}

tasks.named('compileJava') {
    options.compilerArgs << '-Xmaxerrs' << '2000'
}

// Every text file in this tree is UTF-8 (no BOM, LF). Without the flag javac falls back to the platform
// charset, which is GBK on a Chinese Windows box, and a non-ASCII comment or literal then either trips
// "unmappable character" or lands in the class file as mojibake. `withType` rather than
// `named('compileJava')` so the IDE sync and any future source set are covered too; Javadoc reads the
// same files. This file itself stays pure ASCII: Gradle reads build scripts with the platform charset.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// The default test task is off: the checks that matter here need a running game.
tasks.named('test') {
    enabled = false
}

if (portVerificationDir.isPresent()) {
    sourceSets.test.java.setSrcDirs([file(portVerificationDir.get())])
    sourceSets.test.java.include('Port*.java', 'AssemblerVisPoolRegression.java')
    tasks.register('portRegression', JavaExec) {
        group = 'verification'
        description = 'Verify 1.21.1 backport VIS bounds and legacy-save conservation.'
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath + sourceSets.main.runtimeClasspath
        mainClass = 'thaumicenergistics_ce.blockentity.assembler.AssemblerVisPoolRegression'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    }
    
    sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
    sourceSets.test.resources.setSrcDirs([layout.buildDirectory.dir('generated/portTestResources')])
    def generatePortTestRecipe = tasks.register('generatePortTestRecipe', Copy) {
        from(file(portVerificationDir.get() + '/port_payment_regression.json'))
        into layout.buildDirectory.dir('generated/portTestResources/data/thaumicenergistics_ce/recipe')
    }
    def generatePortTestStructure = tasks.register('generatePortTestStructure', JavaExec) {
        dependsOn tasks.named('compileTestJava')
        classpath = sourceSets.test.output.classesDirs + sourceSets.main.runtimeClasspath
        mainClass = 'thaumicenergistics_ce.PortTestStructure'
        def target = layout.buildDirectory.file('generated/portTestResources/data/thaumicenergistics_ce/structure/empty.nbt')
        args target.get().asFile.absolutePath
        outputs.file target
    }
    tasks.named('processTestResources') { dependsOn generatePortTestStructure, generatePortTestRecipe }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_id
            from components.java
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
