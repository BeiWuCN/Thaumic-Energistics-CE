# Access transformer for Thaumic Energistics.
#
# One entry, and it exists because a fake slot has nowhere to be told where it goes. AE2's FakeSlot is
# constructed from an inventory and an index, with no coordinates at all, and Slot's x and y are final in
# vanilla - so a screen outside AE2's own has no supported way to place one. AE2 solves this for itself by
# declaring exactly the same two fields public-f in its own access transformer, with the comment "we need
# to change yPos of existing slots to resize the container". Being an addon rather than AE2, the same
# access has to be declared here to be available at compile time.
#
# The alternative was to reimplement the slot: FakeSlot carries the key wrapping, the validity check, the
# emptying behaviour and the action packet that writes an edit back to the server's copy of the config
# inventory. Reproducing that to avoid two lines of access transformer would be a second implementation of
# a solved problem, and the copy is the part that would rot.

public-f net.minecraft.world.inventory.Slot x
public-f net.minecraft.world.inventory.Slot y
