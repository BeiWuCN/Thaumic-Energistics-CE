[terminals]
    #Hide essentia in ordinary ME terminals. Dedicated Essentia Terminals remain available. Arcane terminals use their own access setting.
    restrictEssentiaVisibility = false
    #Allow wired and wireless arcane crafting terminals to display and transfer essentia when an Essentia Access Card is installed. Disabled by default.
    arcaneEssentiaAccess = false

[patternProviders]
    #Allow AE2 pattern providers to install Essentia Access Cards and send/receive essentia. Disabling preserves installed cards and buffered essentia; cards remain removable. Does not affect other mods’ providers.
    ae2Enabled = true
    #Allow ExtendedAE pattern providers to install Essentia Access Cards and send/receive essentia. Disabling preserves installed cards and buffered essentia; cards remain removable. Does not affect other mods’ providers.
    extendedAeEnabled = true
    #Allow ExtendedAE Plus pattern providers to install Essentia Access Cards and send/receive essentia. Disabling preserves installed cards and buffered essentia; cards remain removable. Does not affect other mods’ providers.
    extendedAePlusEnabled = true
    #Allow AdvancedAE pattern providers to install Essentia Access Cards and send/receive essentia. Disabling preserves installed cards and buffered essentia; cards remain removable.
    advancedAeEnabled = true
    #Allow AE2 Lightning Tech Reborn pattern providers to install Essentia Access Cards and send/receive essentia. Disabling preserves installed cards and buffered essentia; cards remain removable.
    lightningTechEnabled = true

[buses]
    #Allow ME Import, Export and Storage Buses with an Essentia Access Card to access essentia.
    essentiaAccessEnabled = true
    #AE cost per point of essentia transferred by import and export buses. Storage buses use AE2 storage access costs.
    #Range: 0.0 ~ 1000000.0
    aePerEssentia = 10.0

[golemBackpack]
    #Ticks between backpack transfers. 20 ticks equal one second.
    #Range: 1 ~ 12000
    transferIntervalTicks = 20

[arcaneAssembler]
    #Crafting time in ticks without acceleration cards. Each card reduces it by 4 ticks, to a minimum of 4 ticks.
    #Range: 4 ~ 12000
    craftTicks = 20
    #AE consumed per tick while crafting.
    #Range: 0.0 ~ 1000000.0
    aePerTick = 1.5

[essentiaVibrationChamber]
    #Base burn time in ticks. Divide by 1.6 for Potentia and by 2 for other aspects. Applies only to newly ignited fuel.
    #Range: 2 ~ 120000
    baseBurnTicks = 800

[gachaBox]
    #AE consumed when a round starts. Does not affect rounds already in progress.
    #Range: 0.0 ~ 1000000.0
    aePerTurn = 500.0
    #Payout chance for a 30-second round, from 0 to 1.
    #Range: 0.0 ~ 1.0
    chanceAt30Seconds = 0.75
    #Payout chance for a 180-second round, from 0 to 1. Other round lengths use linear interpolation.
    #Range: 0.0 ~ 1.0
    chanceAt180Seconds = 0.45
