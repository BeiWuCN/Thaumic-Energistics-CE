name: build

# Any branch, plus pull requests. Nothing here publishes a mod: the job builds, checks the tree, and
# uploads this mod's own jar as a workflow artifact. See the guard near the end for why that
# distinction is written down rather than assumed.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # The supported 1.0.2 dependency is supplied separately, never committed or uploaded.
      - name: Check dependency availability
        id: dependency
        env:
          DEPENDENCY_URL: ${{ vars.THAUMATURGE_1211_URL }}
        run: |
          if [ -z "$DEPENDENCY_URL" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Compilation requires the supplied Thaumaturge 1.21.1 1.0.2 JAR. Configure THAUMATURGE_1211_URL to enable cloud builds; releases are built and verified locally."
          else
            mkdir -p libs
            curl --fail --location --retry 3 "$DEPENDENCY_URL" -o libs/thaumaturge-1.21.1-NeoForge-1.0.2.jar
            unzip -t libs/thaumaturge-1.21.1-NeoForge-1.0.2.jar
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.dependency.outputs.available == 'true'
        run: ./gradlew build --stacktrace

      # The upload step below hands out build/libs/*.jar. Keep it that way: libs/ holds a build of
      # Thaumaturge, and publishing that would breach its licence.
      - name: Assert no Thaumaturge binary is in the artifact set
        run: |
          if ls build/libs/*.jar 2>/dev/null | grep -qi 'thaumaturge'; then
            echo "::error::Thaumaturge is All Rights Reserved and must not be published as an artifact"
            exit 1
          fi

      - name: Upload the jar
        if: steps.dependency.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: thaumicenergistics-ce
          path: build/libs/*.jar
          if-no-files-found: error
