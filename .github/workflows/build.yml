name: build

# Any branch, plus pull requests. Nothing here publishes a mod: the job builds, checks the tree, and
# uploads this mod's own jar as a workflow artifact. See the guard near the end for why that
# distinction is written down rather than assumed.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      # This line is Java 25 end to end, and so is Thaumaturge: its prism plugin refuses to resolve
      # on anything older, so a JDK 21 runner dies before the first line of either build compiles.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Gradle prepares the pinned dependency directly from its canonical source.
      # Only public Maven downloads are cached; the dependency build itself is not.
      - name: Build
        run: ./gradlew build --stacktrace

      # The upload step below hands out build/libs/*.jar. Keep it that way: the local dependency directory holds a build of
      # Thaumaturge, and publishing that would breach its licence.
      - name: Assert no Thaumaturge binary is in the artifact set
        run: |
          if ls build/libs/*.jar 2>/dev/null | grep -qi 'thaumaturge'; then
            echo "::error::Thaumaturge is All Rights Reserved and must not be published as an artifact"
            exit 1
          fi

      - name: Upload the jar
        uses: actions/upload-artifact@v7
        with:
          name: thaumicenergistics-ce
          path: build/libs/*.jar
          if-no-files-found: error
