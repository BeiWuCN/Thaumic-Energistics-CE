name: build

# Any branch, plus pull requests. Nothing here publishes a mod: the job builds, checks the tree, and
# uploads this mod's own jar as a workflow artifact. See the guard near the end for why that
# distinction is written down rather than assumed.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # Thaumaturge is All Rights Reserved: it publishes no maven artifact and its licence forbids
      # redistributing the mod or a binary built from it, so no public build of it may be downloaded.
      # Section 2.4 permits building it yourself, which is what this does - from the canonical
      # repository, at the commit gradle.properties pins.
      #
      # The checkout is deliberately NOT cached. A cache entry belongs to this repository, and a
      # public repository's caches can be downloaded by anyone who can read it; caching
      # thaumaturge-src would park a Thaumaturge build (its own build/ directory holds the jar) in
      # that store, which is the redistribution section 3.1 forbids. The Gradle caches above hold
      # this mod's own dependencies only: the Thaumaturge jar reaches the build as a libs/ fileTree
      # dependency (see build.gradle) and is never copied into them. For the same reason
      # tools/fetch-thaumaturge.* build it with --no-build-cache - upstream enables the Gradle build
      # cache, so its task output would otherwise land in ~/.gradle/caches/build-cache-1, which is
      # cached above. It is rebuilt from source on every run, which costs a few minutes and is the
      # point.
      #
      # The checkout directory is deliberately not hidden: Gradle refuses to configure a project
      # whose directory name begins with a dot ("The project name '.thaumaturge-src' must not start
      # or end with a '.'"), so a dot-directory here fails before a single line of it compiles.
      - name: Build Thaumaturge from source
        run: ./tools/fetch-thaumaturge.sh
        env:
          THAUMATURGE_SRC: ${{ github.workspace }}/thaumaturge-src
          CI: true

      - name: Build
        run: ./gradlew build --stacktrace

      # The upload step below hands out build/libs/*.jar. Keep it that way: libs/ holds a build of
      # Thaumaturge, and publishing that would breach its licence.
      - name: Assert no Thaumaturge binary is in the artifact set
        run: |
          if ls build/libs/*.jar 2>/dev/null | grep -qi 'thaumaturge'; then
            echo "::error::Thaumaturge is All Rights Reserved and must not be published as an artifact"
            exit 1
          fi

      - name: Upload the jar
        uses: actions/upload-artifact@v7
        with:
          name: thaumicenergistics-ce
          path: build/libs/*.jar
          if-no-files-found: error
